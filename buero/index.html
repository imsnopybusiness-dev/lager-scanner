<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2E5E3E">
<link rel="icon" href="../icon.png">
<title>Warenwirtschaft – Büro</title>
<style>
  :root {
    --g:#2E5E3E; --g-d:#234a31; --g2:#E8F0EA; --g3:#F3F7F4; --t:#1F2937; --m:#6B7280; --l:#E3E7E3; --bg:#F5F7F5;
    --r:#B42318; --r2:#FDECEA; --o:#B45309; --o2:#FEF3C7; --b:#1D4ED8; --b2:#E0E7FF; --w:#fff;
    --rad:12px; --sh:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--t); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  a { color:var(--g); }
  button, input, select, textarea { font:inherit; color:inherit; }
  .app { display:grid; grid-template-columns:232px 1fr; min-height:100vh; }
  /* Sidebar */
  aside { background:var(--g); color:#fff; padding:18px 12px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:4px; }
  .logo { display:flex; align-items:center; gap:10px; padding:4px 10px 18px; font-weight:700; font-size:16px; }
  .logo img { width:30px; height:30px; border-radius:8px; }
  .logo small { display:block; font-weight:400; opacity:.75; font-size:12px; }
  nav a { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:9px; color:#fff; text-decoration:none; opacity:.88; font-weight:500; }
  nav a:hover { background:rgba(255,255,255,.1); opacity:1; }
  nav a.aktiv { background:rgba(255,255,255,.18); opacity:1; }
  nav a .ico { width:20px; text-align:center; }
  nav .sep { height:1px; background:rgba(255,255,255,.15); margin:10px 8px; }
  aside .fuss { margin-top:auto; font-size:12px; opacity:.7; padding:0 10px; }
  aside .fuss a { color:#fff; }
  /* Main */
  main { padding:24px 32px 60px; min-width:0; }
  .kopf { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
  .kopf h1 { font-size:22px; margin:0; }
  .kopf .sub { color:var(--m); font-size:13px; margin-top:2px; }
  .aktionen { display:flex; gap:8px; flex-wrap:wrap; }
  .karte { background:var(--w); border-radius:var(--rad); box-shadow:var(--sh); padding:18px; margin-bottom:18px; }
  .karte h2 { font-size:15px; margin:0 0 12px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .raster { display:grid; gap:16px; }
  .r4 { grid-template-columns:repeat(4, minmax(0,1fr)); } .r3 { grid-template-columns:repeat(3, minmax(0,1fr)); } .r2 { grid-template-columns:repeat(2, minmax(0,1fr)); }
  .r21 { grid-template-columns:minmax(0,2fr) minmax(0,1fr); }
  @media (max-width:1200px) { .r4 { grid-template-columns:repeat(2, minmax(0,1fr)); } .r21 { grid-template-columns:1fr !important; } }
  @media (max-width:820px) { .app { grid-template-columns:1fr; } aside { position:static; height:auto; } .r3, .r2 { grid-template-columns:1fr; } main { padding:16px; } }
  .kpi { background:var(--w); border-radius:var(--rad); box-shadow:var(--sh); padding:16px 18px; }
  .kpi small { color:var(--m); font-size:12.5px; display:block; }
  .kpi b { display:block; font-size:24px; margin:4px 0 2px; letter-spacing:-.3px; }
  .kpi span { color:var(--m); font-size:12.5px; }
  .kpi.klick { cursor:pointer; } .kpi.klick:hover { outline:2px solid var(--g2); }
  /* Buttons */
  .btn { border:0; border-radius:9px; padding:9px 14px; background:var(--g); color:#fff; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; text-decoration:none; }
  .btn:hover { background:var(--g-d); }
  .btn.sek { background:var(--w); color:var(--t); box-shadow:inset 0 0 0 1px var(--l); }
  .btn.sek:hover { background:var(--g3); }
  .btn.rot { background:var(--w); color:var(--r); box-shadow:inset 0 0 0 1px #F5C2BD; }
  .btn.rot:hover { background:var(--r2); }
  .btn.klein { padding:5px 10px; font-size:13px; }
  .btn:disabled { opacity:.5; cursor:default; }
  .icon-btn { border:0; background:none; cursor:pointer; color:var(--m); font-size:16px; padding:4px 6px; border-radius:6px; }
  .icon-btn:hover { background:var(--g3); color:var(--r); }
  /* Form */
  label { display:block; font-size:12.5px; color:var(--m); margin:0 0 4px; font-weight:500; }
  input, select, textarea { width:100%; border:1px solid var(--l); border-radius:9px; padding:8px 10px; background:#fff; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--g); box-shadow:0 0 0 3px var(--g2); }
  textarea { min-height:70px; resize:vertical; }
  .feld { margin-bottom:12px; }
  .fg { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:0 12px; }
  .fg3 { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:0 12px; }
  .voll { grid-column:1 / -1; }
  .filter { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .filter input[type=search] { max-width:320px; }
  .filter select { width:auto; }
  .chk { display:inline-flex; align-items:center; gap:6px; color:var(--t); font-size:13px; cursor:pointer; margin:0; }
  .chk input { width:auto; }
  /* Tabellen */
  .tab-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:12px; color:var(--m); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--l); white-space:nowrap; background:#FAFBFA; position:sticky; top:0; }
  td { padding:8px 10px; border-bottom:1px solid var(--l); vertical-align:middle; }
  tr.klick { cursor:pointer; } tr.klick:hover td { background:var(--g3); }
  td.z, th.z { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  td.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; color:#374151; }
  .thumb { width:40px; height:40px; border-radius:8px; object-fit:contain; background:var(--g3); display:block; }
  .thumb.leer { display:flex; align-items:center; justify-content:center; color:#9CA3AF; font-size:16px; }
  td input.inl { width:90px; padding:5px 8px; text-align:right; }
  .leerstand { color:var(--m); text-align:center; padding:28px; }
  /* Badges */
  .badge { display:inline-block; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:600; background:var(--g3); color:var(--m); white-space:nowrap; }
  .b-Entwurf { background:#F3F4F6; color:#4B5563; } .b-Offen { background:var(--b2); color:var(--b); } .b-Angenommen { background:var(--g2); color:var(--g); }
  .b-Geliefert { background:#DCFCE7; color:#15803D; } .b-Umgewandelt { background:#F3E8FF; color:#7E22CE; } .b-Abgelehnt, .b-Storniert { background:var(--r2); color:var(--r); }
  .b-OK { background:var(--g2); color:var(--g); } .b-warn { background:var(--o2); color:var(--o); }
  .zahl-gut { color:var(--g); font-weight:600; } .zahl-knapp { color:var(--o); font-weight:600; } .zahl-leer { color:var(--r); font-weight:600; }
  .hinweis { background:var(--o2); color:#7C2D12; border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:12px; }
  .info { background:var(--g3); border-radius:10px; padding:10px 12px; font-size:13px; color:#374151; }
  .todo { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--l); }
  .todo:last-child { border-bottom:0; }
  .liste-mini > div { display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--l); font-size:13px; }
  .liste-mini > div:last-child { border-bottom:0; }
  .grau { color:var(--m); }
  /* Diagramm */
  .chart { display:flex; align-items:flex-end; gap:6px; height:160px; padding-top:10px; }
  .chart .s { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; }
  .chart .bar { width:100%; max-width:34px; background:var(--g); border-radius:5px 5px 0 0; min-height:2px; }
  .chart .s:hover .bar { background:#3f7a52; }
  .chart small { font-size:11px; color:var(--m); }
  /* Beleg */
  .summen { margin-left:auto; max-width:340px; }
  .summen div { display:flex; justify-content:space-between; padding:4px 0; }
  .summen .gross { font-size:17px; font-weight:700; border-top:1px solid var(--l); padding-top:8px; margin-top:4px; }
  .neu-pos { display:grid; grid-template-columns:1fr 100px 100px auto; gap:8px; align-items:end; margin-top:14px; }
  .ac { position:relative; }
  .ac-liste { position:absolute; left:0; right:0; top:100%; background:#fff; border:1px solid var(--l); border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.12); z-index:30; max-height:320px; overflow:auto; margin-top:4px; }
  .ac-liste div { display:flex; gap:10px; align-items:center; padding:7px 10px; cursor:pointer; }
  .ac-liste div:hover, .ac-liste div.an { background:var(--g3); }
  .ac-liste img, .ac-liste .ph { width:32px; height:32px; border-radius:6px; object-fit:contain; background:var(--g3); flex-shrink:0; }
  .ac-liste small { color:var(--m); display:block; }
  /* Modal & Drawer */
  .overlay { position:fixed; inset:0; background:rgba(17,24,39,.45); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal { background:#fff; border-radius:14px; width:min(560px, 100%); max-height:92vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.25); }
  .modal.breit { width:min(1100px, 100%); height:92vh; display:flex; flex-direction:column; }
  .modal header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--l); gap:10px; }
  .modal header h3 { margin:0; font-size:16px; }
  .modal .inhalt { padding:18px 20px; }
  .modal footer { display:flex; justify-content:flex-end; gap:8px; padding:14px 20px; border-top:1px solid var(--l); }
  .modal iframe { flex:1; border:0; width:100%; background:#525659; }
  .drawer-bg { position:fixed; inset:0; background:rgba(17,24,39,.35); z-index:40; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(560px, 100%); background:#fff; z-index:41; display:flex; flex-direction:column; box-shadow:-10px 0 40px rgba(0,0,0,.15); }
  .drawer header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--l); }
  .drawer header h3 { margin:0; font-size:17px; }
  .drawer .inhalt { padding:18px 20px; overflow:auto; flex:1; }
  .drawer footer { display:flex; gap:8px; justify-content:flex-end; padding:14px 20px; border-top:1px solid var(--l); }
  .bildfeld { display:flex; gap:14px; align-items:center; margin-bottom:14px; }
  .bildfeld .vorschau { width:110px; height:110px; border-radius:12px; background:var(--g3); object-fit:contain; border:2px dashed var(--l); display:flex; align-items:center; justify-content:center; color:var(--m); font-size:12px; text-align:center; flex-shrink:0; }
  .bildfeld.drag .vorschau { border-color:var(--g); background:var(--g2); }
  .mini-stat { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
  .mini-stat div { background:var(--g3); border-radius:10px; padding:8px; text-align:center; }
  .mini-stat b { display:block; font-size:18px; }
  .mini-stat small { color:var(--m); font-size:12px; }
  /* Einkauf */
  .akq-s0 { background:#EEF0F2; color:#555; } .akq-s1 { background:#E3EDFB; color:#1D4F91; } .akq-s2 { background:#FFF1D6; color:#8A5A00; }
  .akq-s3 { background:#E2F3E7; color:#22663A; } .akq-s4 { background:#F7E3E3; color:#8E2A2A; } .akq-s5 { background:#2E5E3E; color:#fff; }
  .akq-z { display:grid; grid-template-columns:130px 1fr; gap:10px; padding:7px 0; border-bottom:1px solid var(--g3); font-size:14px; }
  .akq-z > span { color:var(--m); font-size:13px; }
  .akq-verlauf { display:flex; flex-direction:column; gap:10px; }
  .akq-e { border-left:3px solid var(--g); background:var(--g3); border-radius:0 10px 10px 0; padding:8px 12px; font-size:14px; }
  .akq-e-kopf { display:flex; gap:10px; align-items:center; margin-bottom:3px; } .akq-e-kopf .grau { font-size:12.5px; } .akq-e-kopf .icon-btn { margin-left:auto; opacity:.5; }
  .reiter { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .reiter a { padding:9px 14px; border-radius:10px; background:var(--w); box-shadow:var(--sh); color:var(--t); text-decoration:none; font-weight:600; display:flex; align-items:center; gap:8px; }
  .reiter a span { background:var(--g3); color:var(--m); border-radius:99px; padding:1px 8px; font-size:12px; }
  .reiter a.an { background:var(--g); color:#fff; } .reiter a.an span { background:rgba(255,255,255,.2); color:#fff; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:0; border-radius:99px; padding:5px 12px; background:var(--g3); color:var(--t); font-weight:500; cursor:pointer; font-size:13px; }
  .chip.an { background:var(--g); color:#fff; }
  .fg4 { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; }
  .fg4 small { display:block; margin-bottom:3px; font-size:12px; }
  table.ek-kalk { font-size:13px; } table.ek-kalk td, table.ek-kalk th { padding:6px 8px; }
  .ek-pack { font-size:12.5px; color:var(--t); background:var(--g3); border-radius:8px; padding:6px 8px; }
  input.markiert { border-color:var(--o); box-shadow:0 0 0 3px var(--o2); }
  .hinweis-box { background:var(--g3); border-radius:10px; padding:9px 12px; margin-bottom:12px; font-size:13.5px; }
  .ek-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:14px; }
  .ek-karte { border:1px solid var(--l); border-radius:12px; overflow:hidden; cursor:pointer; background:#fff; display:flex; flex-direction:column; }
  .ek-karte:hover { box-shadow:0 0 0 2px var(--g2); }
  .ek-bild { height:150px; background:var(--g3); position:relative; display:flex; align-items:center; justify-content:center; color:#9CA3AF; font-size:13px; }
  .ek-bild img { width:100%; height:100%; object-fit:contain; }
  .ek-bild .badge { position:absolute; top:8px; left:8px; }
  .ek-text { padding:12px; display:flex; flex-direction:column; gap:8px; }
  .ek-text > small { color:var(--m); margin-top:-6px; }
  .ek-zahlen { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; font-size:13px; }
  .ek-zahlen small { display:block; color:var(--m); font-size:11.5px; }
  .ek-text .btn { align-self:flex-start; }
  .b-Aktiv { background:var(--g2); color:var(--g); } .b-Erledigt { background:#F3F4F6; color:#4B5563; }
  .b-Neu { background:var(--b2); color:var(--b); } .b-Angefragt { background:var(--o2); color:var(--o); } .b-Gekauft { background:#DCFCE7; color:#15803D; } .b-Verworfen { background:#F3F4F6; color:#6B7280; }
  .p-Hoch { background:var(--r2); color:var(--r); } .p-Mittel { background:var(--o2); color:var(--o); } .p-Niedrig { background:#F3F4F6; color:#6B7280; }
  /* Stocklisten-Ansicht */
  .sl-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:14px; }
  .sl-karte { position:relative; border:1px solid var(--l); border-radius:12px; overflow:hidden; background:#fff; display:flex; flex-direction:column; }
  .sl-bild { height:150px; background:#fff; display:flex; align-items:center; justify-content:center; padding:10px; cursor:zoom-in; border-bottom:1px solid var(--l); color:#9CA3AF; font-size:13px; }
  .sl-bild img { max-width:100%; max-height:100%; object-fit:contain; }
  .sl-text { padding:10px 12px 12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .sl-text > b { font-size:14px; line-height:1.3; }
  .sl-text > small { color:var(--m); margin-top:-3px; }
  .sl-preis { font-size:20px; font-weight:700; color:var(--g); } .sl-preis small { font-size:12px; font-weight:400; color:var(--m); }
  .sl-zahlen { display:flex; justify-content:space-between; font-size:13px; color:var(--m); } .sl-zahlen b { color:var(--t); }
  .sl-aktionen { display:flex; gap:6px; margin-top:auto; padding-top:4px; }
  .sl-stern { position:absolute; top:6px; right:6px; z-index:1; border:0; background:rgba(255,255,255,.9); border-radius:99px; width:32px; height:32px; font-size:18px; cursor:pointer; color:#9CA3AF; }
  td .sl-stern { position:static; background:none; }
  .sl-stern.an { color:#D97706; }
  .sl-mini { height:40px; width:70px; object-fit:contain; cursor:zoom-in; }
  /* Toast & Laden */
  #toasts { position:fixed; right:20px; bottom:20px; display:flex; flex-direction:column; gap:8px; z-index:100; }
  .toast { background:#111827; color:#fff; padding:11px 16px; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.2); max-width:420px; font-size:13.5px; }
  .toast.err { background:var(--r); }
  #laden { position:fixed; top:0; left:0; right:0; height:3px; z-index:200; display:none; overflow:hidden; }
  #laden::after { content:''; position:absolute; height:100%; width:30%; background:var(--g); animation:lade 1s ease-in-out infinite; }
  @keyframes lade { from { left:-30%; } to { left:100%; } }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:dreh 1s linear infinite; }
  .btn.sek .spin { border-color:#ccc; border-top-color:var(--g); }
  @keyframes dreh { to { transform:rotate(360deg); } }
  .skeleton { color:var(--m); padding:40px; text-align:center; }
  .hidden { display:none !important; }
  .zugang { max-width:520px; margin:60px auto; }
</style>
</head>

<div id="laden"></div>
<div class="app">
  <aside>
    <div class="logo"><img src="../icon.png" alt=""><div>Warenwirtschaft<small>Büro</small></div></div>
    <nav id="nav">
      <a href="#uebersicht" data-s="uebersicht"><span class="ico">📊</span>Übersicht</a>
      <a href="#belege" data-s="belege"><span class="ico">🧾</span>Angebote & Belege</a>

</div>

<script>
var APP_VERSION = '2026-11-13d';
/* Selbst-Aktualisierung: holt die Seite ohne Cache und lädt neu, wenn es eine neuere Version gibt */
(function () {
  function pruefen() {
    fetch(location.pathname + '?nc=' + Date.now(), {cache: 'no-store'}).then(function (r) { return r.text(); }).then(function (t) {
      var m = t.match(/APP_VERSION = '([^']+)'/);
      if (m && m[1] !== APP_VERSION && location.search.indexOf('v=' + m[1]) < 0) location.replace(location.pathname + '?v=' + m[1] + location.hash);
    }).catch(function () {});
  }
  pruefen();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) pruefen(); });
})();
/* ============================ Grundlagen ============================ */
var STANDARD_API = 'AKfycbwLqf5z3A39SYeigqJvWV0uRUWMLRiRI2q2HonVWnG2MhDxsfl7sTyXTtdeJoea4uSl';
var API = '', SITZUNG = '', NAME = '';
var C = { artikel: null, kunden: null, lieferanten: null, einst: null };

var eurP = function (x) { return eur(x, 3); }; // Stückpreise (z. B. 0,042 €)

var zahl = function (x) { return (x === '' || x == null) ? '–' : Number(x).toLocaleString('de-DE'); };

var datum = function (iso) { if (!iso) return ''; var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '.' + m[2] + '.' + m[1] : iso; };
var komma = function (x) { return x === '' || x == null ? '' : String(x).replace('.', ','); };

  s = String(s == null ? '' : s).trim(); if (!s || /^(keine|nein|aus|-)$/i.test(s)) return [];
  var out = []; s.replace(/(\d[\d.]*)\s*(?:stk\.?|stück)?\s*[:=>]\s*(\d+(?:[.,]\d+)?)\s*(%|€|eur(?:o)?)?/gi, function (m, ab, w, e) {
    var x = { ab: Number(ab.replace(/\./g, '')) }, n = Number(w.replace(',', '.')), u = String(e || '').toLowerCase();
    if (u === '%' || (!u && !/[.,]/.test(w))) x.rabatt = n / 100; else x.preis = n; out.push(x);
  });
  return out.filter(function (x) { return x.ab > 0 && (x.preis > 0 || (x.rabatt > 0 && x.rabatt < 1)); }).sort(function (a, b) { return a.ab - b.ab; });
}

    return 'ab ' + zahl(x.ab) + ' Stk −' + komma(Math.round(x.rabatt * 1000) / 10) + ' %' + (vk ? ' (' + eurP(vk * (1 - x.rabatt)) + ')' : '');

var laufend = 0;
function laedt(an) { laufend += an ? 1 : -1; $('#laden').style.display = laufend > 0 ? 'block' : 'none'; }
function api(aktion, params) {
  var body = Object.assign({ s: SITZUNG, api: aktion }, params || {});
  if (aktion === 'login') delete body.s;
  laedt(true);
  return fetch(API, { method: 'POST', body: JSON.stringify(body), redirect: 'follow' })
    .then(function (r) { if (!r.ok) throw new Error('Server antwortet nicht (' + r.status + '). Bitte nochmal versuchen.'); return r.json(); })
    .then(function (d) {
      laedt(false);
      if (!d.ok) { if (/anmelden/i.test(d.error) && aktion !== 'login') { SITZUNG = ''; schreib('wwSitzung', ''); zeigeWer(); zeigeZugang(); } throw new Error(d.error); }
      return d.data;
    }, function (e) { laedt(false); if (e instanceof TypeError) throw new Error('Keine Verbindung – Internet prüfen.'); throw e; });
}
function toast(t, fehler) {
  var d = document.createElement('div'); d.className = 'toast' + (fehler ? ' err' : ''); d.textContent = t;
  $('#toasts').appendChild(d); setTimeout(function () { d.remove(); }, fehler ? 7000 : 3500);
}
function fehler(e) { toast(e && e.message ? e.message : String(e), true); }
function knopfLaedt(btn, an) {
  if (!btn) return;
  if (an) { btn.dataset.txt = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> ' + btn.dataset.txt; }
  else { btn.disabled = false; if (btn.dataset.txt) btn.innerHTML = btn.dataset.txt; }
}
function mitKnopf(btn, promise) { knopfLaedt(btn, true); return promise.then(function (x) { knopfLaedt(btn, false); return x; }, function (e) { knopfLaedt(btn, false); throw e; }); }

/* Modal / Drawer */
function modal(html, opts) {
  opts = opts || {};
  var root = $('#modalRoot'), o = document.createElement('div');
  o.className = 'overlay';
  o.innerHTML = '<div class="modal' + (opts.breit ? ' breit' : '') + '">' + html + '</div>';
  root.appendChild(o);
  var zu = function () { o.remove(); if (opts.zu) opts.zu(); document.removeEventListener('keydown', esc_); };
  var esc_ = function (e) { if (e.key === 'Escape') zu(); };
  document.addEventListener('keydown', esc_);
  o.addEventListener('mousedown', function (e) { if (e.target === o) zu(); });
  $$('[data-zu]', o).forEach(function (b) { b.onclick = zu; });
  return { el: o, zu: zu };
}
function drawer(titel, inhalt, fuss) {
  var bg = document.createElement('div'); bg.className = 'drawer-bg';
  var d = document.createElement('div'); d.className = 'drawer';
  d.innerHTML = '<header><h3>' + titel + '</h3><button class="icon-btn" data-zu>✕</button></header><div class="inhalt">' + inhalt + '</div><footer>' + (fuss || '') + '</footer>';
  document.body.appendChild(bg); document.body.appendChild(d);
  var zu = function () { bg.remove(); d.remove(); document.removeEventListener('keydown', esc_); };
  var esc_ = function (e) { if (e.key === 'Escape') zu(); };
  document.addEventListener('keydown', esc_);
  bg.onclick = zu; $$('[data-zu]', d).forEach(function (b) { b.onclick = zu; });
  return { el: d, zu: zu };
}
function frage(titel, text, jaText, gefahr) {
  return new Promise(function (ok) {
    var m = modal('<header><h3>' + esc(titel) + '</h3></header><div class="inhalt">' + text + '</div><footer><button class="btn sek" data-zu>Abbrechen</button><button class="btn' + (gefahr ? ' rot' : '') + '" id="jaBtn">' + esc(jaText || 'OK') + '</button></footer>', { zu: function () { ok(false); } });
    $('#jaBtn', m.el).onclick = function () { m.el.remove(); ok(true); };

}
function pdfZeigen(r) {

  var url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
  modal('<header><h3>' + esc(r.name) + '</h3><div class="aktionen"><a class="btn sek klein" href="' + url + '" download="' + esc(r.name) + '">⬇ Herunterladen</a>' +
    '<a class="btn sek klein" href="' + esc(r.url) + '" target="_blank">In Google Drive öffnen</a><button class="btn klein" data-zu>Schließen</button></div></header>' +
    '<iframe src="' + url + '#view=FitH"></iframe>', { breit: true, zu: function () { URL.revokeObjectURL(url); } });

  document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);

function bildVerkleinern(file) {
  return new Promise(function (ok, nein) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var f = Math.min(1, 1200 / Math.max(img.naturalWidth, img.naturalHeight));
      var cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * f); cv.height = Math.round(img.naturalHeight * f);
      var g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); ok(cv.toDataURL('image/jpeg', 0.85));

}

/* Artikel-Suche (Autocomplete) */
function artikelSuche(input, waehle) {
  var box = document.createElement('div'); box.className = 'ac-liste hidden'; input.parentNode.appendChild(box);
  var treffer = [], idx = 0;
  function zeige() {
    var q = input.value.trim().toLowerCase();
    if (!q || !C.artikel) { box.classList.add('hidden'); return; }
    treffer = C.artikel.filter(function (a) { return a.ean.indexOf(q) >= 0 || a.name.toLowerCase().indexOf(q) >= 0; }).slice(0, 12);
    idx = 0;
    box.innerHTML = treffer.length ? treffer.map(function (a, i) {
      return '<div data-i="' + i + '"' + (i === 0 ? ' class="an"' : '') + '>' + (a.bild ? '<img src="' + esc(a.bild) + '">' : '<span class="ph"></span>') +
        '<span>' + esc(a.name) + '<small>' + esc(a.ean) + ' · verfügbar ' + zahl(a.verfuegbar) + ' · VK ' + eurP(a.vk) + '</small></span></div>';
    }).join('') : '<div class="grau">Kein Artikel gefunden</div>';
    box.classList.remove('hidden');
  }
  input.addEventListener('input', zeige);
  input.addEventListener('focus', zeige);
  input.addEventListener('blur', function () { setTimeout(function () { box.classList.add('hidden'); }, 150); });
  input.addEventListener('keydown', function (e) {
    if (box.classList.contains('hidden')) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(0, Math.min(treffer.length - 1, idx + (e.key === 'ArrowDown' ? 1 : -1))); $$('div[data-i]', box).forEach(function (d, i) { d.classList.toggle('an', i === idx); }); }
    if (e.key === 'Enter' && treffer[idx]) { e.preventDefault(); box.classList.add('hidden'); waehle(treffer[idx]); }
  });
  box.addEventListener('mousedown', function (e) { var d = e.target.closest('div[data-i]'); if (d) { e.preventDefault(); box.classList.add('hidden'); waehle(treffer[+d.dataset.i]); } });
}

function route() {

  var h = (location.hash || '#uebersicht').slice(1), teile = h.split('/'), s = teile[0] || 'uebersicht';
  $$('#nav a').forEach(function (a) { a.classList.toggle('aktiv', a.dataset.s === s || (s === 'beleg' && a.dataset.s === 'belege')); });
  var f = SEITEN[s] || SEITEN.uebersicht;
  $('#main').innerHTML = '<div class="skeleton">Lädt …</div>';
  window.scrollTo(0, 0);
  f(decodeURIComponent(teile.slice(1).join('/')));
}
window.addEventListener('hashchange', route);

function zeigeZugang() {
  $$('#nav a').forEach(function (a) { a.classList.remove('aktiv'); });
  $('#main').innerHTML = '<div class="karte zugang"><h2>Anmelden</h2><p class="grau" style="margin-top:0">Mit eurem Namen und Passwort. Benutzer und Passwörter legt ihr im Google Sheet an: <b>Warenwirtschaft → Benutzer & Passwörter</b>. Die Anmeldung bleibt 30 Tage auf diesem Rechner gespeichert.</p>' +
    '<form id="lForm"><div class="feld"><label>Name</label><input id="lName" autocomplete="username" value="' + esc(NAME) + '"></div>' +
    '<div class="feld"><label>Passwort</label><input id="lPw" type="password" autocomplete="current-password"></div><button class="btn" id="lOk" type="submit">Anmelden</button></form></div>';

  $('#lForm').onsubmit = function (e) {

    mitKnopf($('#lOk'), api('login', { name: name, pw: pw })).then(function (d) {
      SITZUNG = d.sitzung; NAME = d.name; schreib('wwSitzung', SITZUNG); schreib('wwName', NAME); zeigeWer();

      var felder = $$('input[data-z]').map(function (i) { var z = +i.dataset.z, w = i.value; if (z === 18) { var n = parseFloat(w.replace(',', '.')); w = isNaN(n) ? '' : String(n > 1 ? n / 100 : n); } return { zeile: z, wert: w }; });
      mitKnopf(this, api('b_einstellungen_speichern', { daten: { felder: felder, kategorien: $('#esKat').value.split('\n'), schwelle: $('#esSchw').value } }))
        .then(function (d) { C.einst = d; toast('Einstellungen gespeichert.'); }).catch(fehler);
    };
    $('#esAbm').onclick = abmelden;
  }).catch(fehler);
};

ladeSitzung();
route();
</script>
